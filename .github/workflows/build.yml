---
name: Convert, Build and Deploy Documentation

"on":
  push:
    branches:
      - main  # Change to your default branch if different
  workflow_dispatch:  # Allows manual triggering

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc git

      - name: Create a venv
        run: uv venv

      - name: Install MkDocs and dependencies
        run: uv pip install mkdocs mkdocs-material

      - name: Fetch the documentation XML files
        run: make checkout

      - name: Convert XML to Markdown with Pandoc
        run: make docs

      - name: Activate the venv
        run: source .venv/bin/activate

      - name: Build MkDocs site
        run: mkdocs build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
